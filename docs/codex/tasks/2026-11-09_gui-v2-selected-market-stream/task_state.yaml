scope:
  forbidden:
    - automatic bulk subscriptions or implicit subscription on navigation/search
    - LIVE/AUTO activation, ticket preparation or broker orders
    - technical/IA score invention without attested closed candles and exact bindings
decisions:
  - The user must select one catalogue row and explicitly start the feed.
  - The controller reuses IGStreamingAdapter and owns at most one PRICE subscription.
  - Search, account switch, disconnect and window close stop the feed first.
  - Quotes merge only into an EPIC already exposed by the current REST catalogue.
  - Runtime generation rejection prevents stale callbacks from mutating a new account context.
  - Same-EPIC model updates emit dataChanged instead of modelReset, preserving selection.
