  endpoint: GET /accounts v1
  fields:
    balance: balance of funds in the account
    available: amount available for trading
    profitLoss: account profit and loss amount
    deposit: minimum deposit amount required for margins
decisions:
  - Convert REST floats through Decimal(str(value)) and preserve the account currency.
  - Mark every metric as an ig-rest-accounts snapshot with receipt timestamp provenance.
  - Show Solde IG, Disponible and PnL in the header; show four IG cards in the dashboard.
  - Keep realized day/week/month PnL and positions explicitly scoped to local Paper.
  - Do not label REST balance as real-time equity; equity remains unavailable until an attested ACCOUNT stream exists.
  - Refresh the snapshot on DEMO connection and confirmed account switch only.
