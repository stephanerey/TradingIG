decisions:
  - Tavily utilise seulement topic=news car le contrat officiel actuel n'accepte que general/news.
  - Tavily Basic coute un credit; plafond applicatif mensuel 900 et budget planifie 704.
  - GDELT reste une source de decouverte non confirmee et sa tonalite ne produit aucun signal.
  - Les credits sont reserves avant l'appel et conserves en cas d'issue inconnue.
  - Tavily Search reste prioritaire; Extract Basic est limite a cinq URL et n'est lance qu'apres consentement OpenAI explicite.
  - La selection IA est limitee a cinq articles dedupliques, classes par pertinence, qualite et diversite.
  - Les extraits complets restent en memoire; seuls faits structures et references de sources sont persistants.
  - Les fenetres par categorie sont configurables et valent par defaut 6h, 24h, 72h et 168h.
  - GDELT utilise Retry-After et un circuit breaker; sa panne ne bloque ni Tavily ni les sources officielles.
