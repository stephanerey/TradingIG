[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ig-assistant"
version = "0.1.0"
description = "Safe MVP skeleton for an assisted IG trading desktop application."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Stephane Rey" }]
dependencies = [
  "keyring>=25",
  "PyQt5>=5.15",
  "pyqtgraph>=0.13",
]

[project.optional-dependencies]
secure-store = ["keyring>=25"]
dev = ["pytest>=8", "ruff>=0.6"]
gui = ["PyQt5>=5.15", "pyqtgraph>=0.13"]

[project.scripts]
trading-ig-assistant = "trading_ig_assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
